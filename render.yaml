services:
  # Backend Web Service
  - type: web
    name: ventura-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false # User needs to enter this in dashboard
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000

  # Frontend Static Site
  - type: web
    name: ventura-frontend
    env: static
    plan: free
    rootDir: Ventura-Booking-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
